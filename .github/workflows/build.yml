name: Build & push garmin-worker image

# Builds the Cairn Garmin worker image (Dockerfile) with BuildKit and, on a
# successful build, pushes it to the GitHub Container Registry tagged by git tag
# and commit hash.
#
# Registry: ghcr.io/johnnycube/cairn-provider-garmin
# Auth: the built-in GITHUB_TOKEN (packages: write) — no extra secret needed.
#
# Supply chain: pushed images carry BuildKit SLSA provenance + SBOM
# attestations, are signed keyless with cosign (Fulcio cert bound to this
# workflow's OIDC identity, logged in Rekor), and get a GitHub provenance
# attestation (verifiable via `gh attestation verify`). Verify with:
#   cosign verify ghcr.io/johnnycube/cairn-provider-garmin:<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       '^https://github.com/johnnycube/cairn-provider-garmin/\.github/workflows/build\.yml@.*'
#
# The Garmin worker is Python; the generated proto stubs it imports (./proto)
# are committed, so no `make proto` / buf step is needed. This repo has no
# dependency on cairn-core.
#
# NB: this does NOT use the shared cairn-build-base toolchain image (unlike the
# Go core/strava jobs). build-base ships Debian's Python 3.11, but this worker
# pins Python 3.14 — so CI and the image use python:3.14 directly instead.
#
# Triggers:
#   - push to the default branch  → publishes  sha-<short>  (+ latest)
#   - push of a v* git tag        → publishes  <tag>  + sha-<short>
#   - pull_request                → builds only (no push), as a gate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: build-worker-garmin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/johnnycube/cairn-provider-garmin

jobs:
  # Gate: the worker must import + byte-compile cleanly with its real deps.
  test:
    name: Worker checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: Byte-compile package
        run: python -m compileall -q cairn_garmin
      - name: Run tests
        run: python -m pytest tests -q
      - name: Import smoke test
        run: python -c "import cairn_garmin.runtime, cairn_garmin.archive"

  build-push:
    name: Build & push cairn-provider-garmin
    runs-on: ubuntu-latest
    needs: test
    # id-token/attestations only here — the test job stays unprivileged. This
    # job also runs on PRs (build-only gate); the sign/attest steps are gated
    # off there, and fork PRs get no OIDC token anyway.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Publish only from main or a v* release tag — never from PRs/feature
      # branches (which build as a gate but must not touch the registry).
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (BuildKit)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit-level SLSA provenance + SBOM, attached to the image index.
          provenance: mode=max
          sbom: true

      # Keyless sigstore signing — one signature on the pushed digest covers
      # every tag of this push. Gated like `push:` so it never runs unpushed.
      - name: Install cosign
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v4

      - name: Sign image (keyless)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      # GitHub-native provenance attestation (Attestations tab, `gh attestation
      # verify`), stored alongside the image in ghcr.
      - name: Attest build provenance
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
